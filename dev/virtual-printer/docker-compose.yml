# Simulated Klipper + Moonraker for developing Klipper Code.
# Run from this folder: docker compose up -d
services:
  printer:
    container_name: klipper-code-printer
    image: ghcr.io/mainsail-crew/virtual-klipper-printer:latest
    volumes:
      - ./printer_data:/home/printer/printer_data:delegated,Z
    ports:
      - "7125:7125" # Moonraker API
      - "8110:8080" # Mainsail bundled in the image (not the dev fork)
    tmpfs:
      - /tmp:noexec
      - /home/printer/printer_data/comms:noexec
